services:
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    container_name: portfolio-app
    ports:
      - "80:80"
    restart: unless-stopped

  java-app:
    build:
      context: ./java
      dockerfile: Dockerfile
    container_name: java-yearbook-app
    ports:
      - "8081:8081"
    restart: unless-stopped